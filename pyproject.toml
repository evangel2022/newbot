[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newbot"
version = "0.0.1"
description = "A self-hosted, provider-agnostic agent runtime."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
newbot = "newbot.cli.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newbot"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["newbot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
