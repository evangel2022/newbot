name: 🐛 Bug report
description: Report a problem that should be fixed
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        Security vulnerabilities must **not** be reported here — see [SECURITY.md](../../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or commands that reproduce the problem.
      placeholder: |
        1. Run `newbot ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: newbot version
      description: Output of `newbot --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error output. Do not include secrets or API keys.
      render: shell
