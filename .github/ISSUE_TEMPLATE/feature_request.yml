name: ✨ Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that newbot cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the capability you would like and where you think it belongs (tool, transport, extension, core).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I understand this should extend at the edges and not grow the agent core (see docs/ARCHITECTURE.md)
          required: true
