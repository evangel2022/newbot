<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>newbot workbench</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <main>
      <h1>newbot workbench</h1>
      <p id="capabilities">connecting...</p>
      <label>Access token <input id="token" type="password" autocomplete="off"></label>
      <button id="connect" type="button">Connect stream</button>
      <label>Conversation <input id="conversation" value="default"></label>
      <form id="compose">
        <input id="message" placeholder="Message" autocomplete="off">
        <button type="submit">Send</button>
      </form>
      <pre id="transcript"></pre>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
